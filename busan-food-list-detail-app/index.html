<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="부산시 공공데이터를 활용한 부산맛집 검색 서비스">
  <title>부산맛지도</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- ========================================
       HEADER
  ========================================= -->
  <header class="header">
    <div class="inner header-inner">
      <button id="logoBtn" class="logo" type="button" aria-label="부산맛지도 홈으로 이동">
        부산맛지도
      </button>

      <div class="header-right">
        <button id="apiStatusBtn" class="api-status-btn" type="button">
          API 상태 확인
        </button>

        <label class="blind" for="languageSelect">언어 선택</label>
        <select id="languageSelect" class="language-select">
          <option value="kr">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zhs">中文简体</option>
          <option value="zht">中文繁體</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ========================================
       HERO / SEARCH
  ========================================= -->
  <section class="hero">
    <div class="inner">
      <p class="hero-label">BUSAN FOOD GUIDE</p>
      <h1>부산 맛집을 검색해보세요</h1>
      <p class="hero-desc">
        맛집명, 대표 메뉴, 주소, 지역으로 검색할 수 있습니다.
      </p>

      <div class="search-wrap">
        <label class="blind" for="searchInput">부산 맛집 검색</label>
        <input
          id="searchInput"
          type="search"
          placeholder="예: 밀면, 초밥, 강서구"
          autocomplete="off"
        >
        <button id="searchBtn" type="button">검색</button>
      </div>

      <div class="quick-keywords" aria-label="빠른 검색">
        <button type="button" data-keyword="밀면">밀면</button>
        <button type="button" data-keyword="초밥">초밥</button>
        <button type="button" data-keyword="한식">한식</button>
        <button type="button" data-keyword="강서구">강서구</button>
      </div>
    </div>
  </section>

  <!-- ========================================
       MAIN CONTENT
  ========================================= -->
  <main class="main">
    <div class="inner">

      <!-- ========================================
           AREA FILTER
      ========================================= -->
      <section class="filter-section">
        <div class="section-head">
          <div>
            <span class="section-label">AREA</span>
            <h2>지역별 맛집</h2>
          </div>

          <button id="resetBtn" class="reset-btn" type="button">
            전체 초기화
          </button>
        </div>

        <div id="areaFilter" class="area-filter"></div>
      </section>

      <!-- ========================================
           SEARCH RESULT LIST
      ========================================= -->
      <section class="result-section">
        <div class="result-head">
          <div>
            <span class="section-label">RESULT</span>
            <h2>검색 결과</h2>
          </div>

          <strong id="resultCount" class="result-count">
            0개
          </strong>
        </div>

        <div id="searchSummary" class="search-summary" hidden></div>

        <div
          id="restaurantList"
          class="restaurant-list"
          aria-live="polite"
        ></div>

        <div class="load-more-wrap">
          <button id="loadMoreBtn" class="load-more-btn" type="button">
            더보기
          </button>
        </div>
      </section>

      <!-- ========================================
           FAVORITE
      ========================================= -->
      <section class="favorite-section">
        <div class="result-head">
          <div>
            <span class="section-label">FAVORITE</span>
            <h2>찜한 맛집</h2>
          </div>
        </div>

        <div id="favoriteList" class="restaurant-list"></div>
      </section>

    </div>
  </main>

  <!-- ========================================
       DETAIL MODAL
  ========================================= -->
  <div id="detailModal" class="detail-modal" aria-hidden="true">
    <div id="modalDim" class="modal-dim"></div>

    <article
      class="detail-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
    >
      <button
        id="detailCloseBtn"
        class="detail-close"
        type="button"
        aria-label="맛집 상세 닫기"
      >
        ×
      </button>

      <div id="detailContent"></div>
    </article>
  </div>

  <!-- ========================================
       API DEBUG MODAL
  ========================================= -->
  <div id="debugModal" class="debug-modal" aria-hidden="true">
    <div class="debug-box">
      <button id="debugCloseBtn" class="debug-close" type="button" aria-label="API 상태창 닫기">
        ×
      </button>

      <h2>API 연결 상태</h2>

      <div id="debugContent"></div>
    </div>
  </div>

  <!-- ========================================
       TOAST
  ========================================= -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- JavaScript는 1개 파일만 사용 -->
  <script src="./js/script.js"></script>
</body>
</html>
