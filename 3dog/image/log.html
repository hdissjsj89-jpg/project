<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 앱 전용 화면 설정 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>PetCare 로그인</title>

    <style>
        /* ========================================
           기본 초기화
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family:
                Pretendard,
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                Arial,
                sans-serif;
        }

        input,
        button {
            border: 0;
            outline: none;
            background: none;
            font: inherit;
        }

        button,
        label,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ========================================
           모바일 전용 로그인 화면
           기준 크기: 390 × 844px
        ======================================== */
        .login-screen {
            position: relative;
            width: 100%;
            height: 844px;
            min-height: 844px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ========================================
           상단 제목 영역
        ======================================== */
        .login-header {
            position: absolute;
            top: 63px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            text-align: center;
        }

        .login-title {
            color: #111111;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -2px;
        }

        .login-description {
            margin-top: 40px;
            color: #888888;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: -1.1px;
        }

        /* ========================================
           로그인 폼 영역
        ======================================== */
        .login-form {
            position: absolute;
            top: 246px;
            left: 20px;
            width: calc(100% - 40px);
        }

        /* 입력창 공통 */
        .input-group {
            position: relative;
            width: 100%;
            height: 69px;
            margin-bottom: 11px;
        }

        .login-input {
            width: 100%;
            height: 100%;
            padding: 0 55px 0 19px;
            border: 1px solid #dedede;
            border-radius: 16px;
            background-color: #ffffff;
            color: #333333;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .login-input::placeholder {
            color: #c8c8c8;
            opacity: 1;
        }

        .login-input:focus {
            border-color: #49a477;
        }

        /* 비밀번호 보기 버튼 */
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 18px;
            width: 25px;
            height: 25px;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .eye-icon {
            position: absolute;
            top: 6px;
            left: 2px;
            width: 21px;
            height: 14px;
            border: 2px solid #bdbdbd;
            border-radius: 50%;
        }

        .eye-icon::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            border: 2px solid #bdbdbd;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* ========================================
           로그인 상태 유지
        ======================================== */
        .remember-area {
            display: flex;
            align-items: center;
            margin-top: 37px;
        }

        .remember-checkbox {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
        }

        .checkbox-design {
            position: relative;
            width: 20px;
            height: 20px;
            margin-right: 22px;
            border: 2px solid #8d8d8d;
            border-radius: 3px;
            background-color: #ffffff;
            cursor: pointer;
        }

        .remember-checkbox:checked + .checkbox-design {
            border-color: #49a477;
            background-color: #49a477;
        }

        .remember-checkbox:checked + .checkbox-design::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 6px;
            width: 5px;
            height: 10px;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
        }

        .remember-text {
            color: #858585;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1px;
            cursor: pointer;
        }

        /* ========================================
           로그인 버튼
        ======================================== */
        .login-button {
            width: 100%;
            height: 78px;
            margin-top: 40px;
            border-radius: 15px;
            background-color: #49a477;
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1.5px;
            cursor: pointer;
        }

        .login-button:active {
            background-color: #3d9269;
        }

        /* ========================================
           구분선 영역
        ======================================== */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 43px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background-color: #d3d3d3;
        }

        .divider-text {
            margin: 0 23px;
            color: #7f7f7f;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        /* ========================================
           소셜 로그인 영역
        ======================================== */
        .social-login {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 37px;
            margin-top: 24px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 78px;
            height: 78px;
            border: 3px solid #e6e6e6;
            border-radius: 50%;
            background-color: #ffffff;
            cursor: pointer;
        }

        .social-button:active {
            background-color: #f7f7f7;
        }

        .social-icon {
            display: block;
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .social-button.kakao .social-icon {
            width: 39px;
            height: 39px;
        }

        .social-button.google .social-icon {
            width: 38px;
            height: 38px;
        }

        .social-button.apple .social-icon {
            width: 43px;
            height: 43px;
        }

        /* ========================================
           회원가입 안내
        ======================================== */
        .signup-guide {
            margin-top: 41px;
            color: #777777;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .signup-link {
            margin-left: 3px;
            color: #ff5c7a;
        }
    </style>
</head>

<body>
    <main class="login-screen">

        <!-- 상단 제목 영역 -->
        <header class="login-header">
            <h1 class="login-title">로그인</h1>

            <p class="login-description">
                반려동물의 건강을<br>
                함께 지켜주세요.
            </p>
        </header>

        <!-- 로그인 폼 -->
        <form class="login-form" action="#" method="post">

            <!-- 이메일 또는 휴대폰 입력 -->
            <div class="input-group">
                <input
                    type="text"
                    class="login-input"
                    name="userId"
                    placeholder="이메일 또는 휴대폰"
                    autocomplete="username"
                    aria-label="이메일 또는 휴대폰"
                >
            </div>

            <!-- 비밀번호 입력 -->
            <div class="input-group">
                <input
                    type="password"
                    class="login-input"
                    name="password"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    aria-label="비밀번호"
                >

                <button
                    type="button"
                    class="password-toggle"
                    aria-label="비밀번호 보기"
                >
                    <span class="eye-icon" aria-hidden="true"></span>
                </button>
            </div>

            <!-- 로그인 상태 유지 -->
            <div class="remember-area">
                <input
                    type="checkbox"
                    id="rememberLogin"
                    class="remember-checkbox"
                >

                <label
                    for="rememberLogin"
                    class="checkbox-design"
                    aria-hidden="true"
                ></label>

                <label
                    for="rememberLogin"
                    class="remember-text"
                >
                    로그인 상태 유지
                </label>
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit" class="login-button">
                로그인
            </button>

            <!-- 또는 구분선 -->
            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">또는</span>
                <span class="divider-line"></span>
            </div>

            <!-- 소셜 로그인 -->
            <div class="social-login">

                <!-- 카카오 로그인 -->
                <button
                    type="button"
                    class="social-button kakao"
                    aria-label="카카오로 로그인"
                >
                    <img
                        src="./kakao.svg"
                        alt="카카오"
                        class="social-icon"
                    >
                </button>

                <!-- 구글 로그인 -->
                <button
                    type="button"
                    class="social-button google"
                    aria-label="구글로 로그인"
                >
                    <img
                        src="./google.svg"
                        alt="구글"
                        class="social-icon"
                    >
                </button>

                <!-- 애플 로그인 -->
                <button
                    type="button"
                    class="social-button apple"
                    aria-label="애플로 로그인"
                >
                    <img
                        src="./apple.svg"
                        alt="애플"
                        class="social-icon"
                    >
                </button>
            </div>

            <!-- 회원가입 안내 -->
            <p class="signup-guide">
                계정이 없으신가요?
                <a href="signup.html" class="signup-link">
                    회원가입
                </a>
            </p>

        </form>

    </main>
</body>
</html>
