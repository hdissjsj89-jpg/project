<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
    minimum-scale=1.0, user-scalable=no"
  >

  <title>행복 동물병원</title>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
  >

  <style>
    /* ==============================
       기본 설정
    ============================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    button,
    a {
      font-family: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    /* ==============================
       모바일 앱 전체 화면
    ============================== */
    .app {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #ffffff;
    }

    .app-content {
      width: 100%;
      height: calc(100svh - 76px);
      overflow-y: auto;
      overscroll-behavior-y: contain;
      padding-bottom: 108px;
      scrollbar-width: none;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    /* ==============================
       상단 헤더
    ============================== */
    .top-header {
      display: flex;
      align-items: center;
      width: 100%;
      height: 68px;
      padding: 12px 20px 4px;
      background: #ffffff;
    }

    .back-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      margin-left: -8px;
      border-radius: 50%;
    }

    .back-button:active {
      background: #f3f3f3;
    }

    .back-icon {
      position: relative;
      display: block;
      width: 20px;
      height: 20px;
    }

    .back-icon::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 3px;
      width: 11px;
      height: 11px;
      border-left: 2px solid #111111;
      border-bottom: 2px solid #111111;
      transform: translateY(-50%) rotate(45deg);
    }

    .back-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 3px;
      width: 18px;
      height: 2px;
      background: #111111;
      transform: translateY(-50%);
    }

    /* ==============================
       메인 배너 Swiper
    ============================== */
    .banner-section {
      width: 100%;
      padding: 8px 20px 0;
    }

    .main-banner {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 640 / 385;
      overflow: hidden;
      border-radius: 24px;
      background: #eeeeee;
    }

    .main-banner .swiper-wrapper {
      width: 100%;
      height: 100%;
    }

    .main-banner .swiper-slide {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eeeeee;
    }

    .main-banner .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 페이지 번호 */
    .slide-number {
      position: absolute;
      right: 14px;
      bottom: 13px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 26px;
      padding: 0 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.48);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
    }

    /* Swiper 기본 pagination은 숨김 */
    .main-banner .swiper-pagination {
      display: none;
    }

    /* ==============================
       병원 기본 정보
    ============================== */
    .hospital-info {
      width: 100%;
      padding: 15px 20px 0;
    }

    .hospital-name {
      font-size: 28px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: -1.1px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      width: 100%;
      margin-top: 11px;
      font-size: 16px;
    }

    .rating-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .star {
      color: #ffbd21;
      font-size: 22px;
      line-height: 1;
    }

    .rating-score {
      font-weight: 800;
    }

    .review-count {
      color: #929292;
      font-size: 14px;
    }

    .distance {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      color: #8c8c8c;
      font-size: 14px;
    }

    .heart-icon {
      font-size: 21px;
      line-height: 1;
    }

    /* ==============================
       상태 태그
    ============================== */
    .tag-list {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 13px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tag-list::-webkit-scrollbar {
      display: none;
    }

    .tag {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 41px;
      padding: 0 16px;
      border: 1px solid #6bb7ff;
      border-radius: 22px;
      background: #f7fbff;
      color: #23a26d;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ==============================
       병원 상세 정보
    ============================== */
    .detail-list {
      width: 100%;
      margin-top: 24px;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      width: 100%;
      margin-bottom: 18px;
      color: #545454;
      font-size: 15px;
      line-height: 1.5;
    }

    .detail-icon {
      flex: 0 0 28px;
      width: 28px;
      padding-top: 1px;
      color: #24a56f;
      font-size: 18px;
    }

    .detail-icon.address {
      color: #66b8ff;
    }

    .detail-icon.phone {
      color: #ff6683;
    }

    .detail-label {
      flex: 0 0 60px;
      width: 60px;
    }

    .detail-value {
      flex: 1;
      min-width: 0;
    }

    .business-hours {
      width: 100%;
      margin-top: -2px;
      padding-left: 28px;
    }

    .hours-title {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      color: #545454;
      font-size: 15px;
    }

    .clock-icon {
      width: 28px;
      margin-left: -28px;
      color: #23a26d;
      font-size: 18px;
    }

    .hours-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.4;
    }

    .hours-day {
      flex: 0 0 60px;
      color: #666666;
    }

    .hours-time {
      color: #111111;
      font-weight: 500;
    }

    /* ==============================
       하단 문의 / 예약 버튼
    ============================== */
    .action-area {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 27px;
    }

    .action-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50%;
      height: 52px;
      border-radius: 17px;
      font-size: 19px;
      font-weight: 800;
    }

    .inquiry-button {
      border: 2px solid #219c65;
      background: #ffffff;
      color: #219c65;
    }

    .reservation-button {
      border: 2px solid #51b97a;
      background: #16964e;
      color: #ffffff;
    }

    .phone-symbol {
      margin-right: 7px;
      color: #ff6683;
      font-size: 23px;
    }

    .action-button:active {
      transform: scale(0.98);
    }

    /* ==============================
       하단 네비게이션
    ============================== */
    .bottom-navigation {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      width: 100%;
      height: 76px;
      border-top: 1px solid #dedede;
      background: #ffffff;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.03);
    }

    .nav-item {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 76px;
      gap: 6px;
      color: #111111;
      font-size: 12px;
    }

    .nav-item.active {
      color: #25a66f;
    }

    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      font-size: 23px;
      line-height: 1;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="app">

    <main class="app-content">

      <!-- 상단 뒤로가기 -->
      <header class="top-header">
        <button
          type="button"
          class="back-button"
          aria-label="이전 화면으로 이동"
          onclick="history.back();"
        >
          <span class="back-icon"></span>
        </button>
      </header>

      <!-- 메인 배너 슬라이드 -->
      <section class="banner-section">

        <div class="swiper main-banner">

          <div class="swiper-wrapper">

            <!-- 슬라이드 1 -->
            <div class="swiper-slide">
              <img
                src="./images/slid1.png"
                alt="행복 동물병원 내부 전경"
              >
            </div>

            <!-- 슬라이드 2 -->
            <div class="swiper-slide">
              <img
                src="./images/slid2.png"
                alt="수의사와 반려견 진료 안내"
              >
            </div>

            <!-- 슬라이드 3 -->
            <div class="swiper-slide">
              <img
                src="./images/slid3.png"
                alt="반려견 건강검진 안내"
              >
            </div>

          </div>

          <!-- 현재 슬라이드 번호 -->
          <div class="slide-number">
            <span id="currentSlide">1</span>
            <span>&nbsp;/&nbsp;</span>
            <span id="totalSlide">3</span>
          </div>

          <div class="swiper-pagination"></div>

        </div>
      </section>

      <!-- 병원 정보 -->
      <section class="hospital-info">

        <h1 class="hospital-name">행복 동물병원</h1>

        <div class="rating-row">
          <div class="rating-group">
            <span class="star">★</span>
            <span class="rating-score">4.8</span>
            <span class="review-count">(126)</span>
          </div>

          <div class="distance">
            <span class="heart-icon">♡</span>
            <span>1.2km</span>
          </div>
        </div>

        <!-- 병원 태그 -->
        <div class="tag-list">
          <span class="tag">야간진료</span>
          <span class="tag">예약가능</span>
          <span class="tag">주차가능</span>
        </div>

        <!-- 상세 정보 -->
        <div class="detail-list">

          <div class="detail-row">
            <span class="detail-icon address">⌂</span>
            <span class="detail-value">
              서울시 강남구 테헤란로 123
            </span>
          </div>

          <div class="detail-row">
            <span class="detail-icon phone">♧</span>
            <a
              class="detail-value"
              href="tel:021234567"
            >
              02-123-4567
            </a>
          </div>

          <div class="business-hours">
            <div class="hours-title">
              <span class="clock-icon">◉</span>
              <span>진료시간</span>
            </div>

            <div class="hours-row">
              <span class="hours-day">평일</span>
              <span class="hours-time">09:00 - 20:00</span>
            </div>

            <div class="hours-row">
              <span class="hours-day">토요일</span>
              <span class="hours-time">09:00 - 17:00</span>
            </div>

            <div class="hours-row">
              <span class="hours-day">일요일</span>
              <span class="hours-time">10:00 - 16:00</span>
            </div>
          </div>

        </div>

        <!-- 문의 및 예약 버튼 -->
        <div class="action-area">

          <a
            href="tel:021234567"
            class="action-button inquiry-button"
          >
            <span class="phone-symbol">♧</span>
            문의하기
          </a>

          <a
            href="/reservation.html"
            class="action-button reservation-button"
          >
            예약하기
          </a>

        </div>

      </section>
    </main>

    <!-- 하단 네비게이션 -->
    <nav class="bottom-navigation">

      <a
        href="/home.html"
        class="nav-item"
      >
        <span class="nav-icon">⌂</span>
        <span class="nav-label">홈</span>
      </a>

      <a
        href="/search.html"
        class="nav-item active"
      >
        <span class="nav-icon">⌕</span>
        <span class="nav-label">탐색</span>
      </a>

      <a
        href="/saved.html"
        class="nav-item"
      >
        <span class="nav-icon">▢</span>
        <span class="nav-label">저장</span>
      </a>

      <a
        href="/my.html"
        class="nav-item"
      >
        <span class="nav-icon">♙</span>
        <span class="nav-label">MY</span>
      </a>

    </nav>
  </div>

  <!-- Swiper JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

  <script>
    const currentSlide = document.getElementById("currentSlide");
    const totalSlide = document.getElementById("totalSlide");

    const mainBannerSwiper = new Swiper(".main-banner", {
      slidesPerView: 1,
      spaceBetween: 0,
      speed: 650,

      /* 마지막 슬라이드 다음에 첫 번째 슬라이드 표시 */
      loop: true,

      /* 손가락 터치 슬라이드 */
      allowTouchMove: true,
      grabCursor: true,

      /* 자동 슬라이드 */
      autoplay: {
        delay: 3000,
        disableOnInteraction: false,
        pauseOnMouseEnter: true
      },

      /* 페이지네이션 */
      pagination: {
        el: ".swiper-pagination",
        clickable: true
      },

      /* 슬라이드 변경 시 숫자 변경 */
      on: {
        init: function () {
          totalSlide.textContent =
            document.querySelectorAll(
              ".main-banner .swiper-slide:not(.swiper-slide-duplicate)"
            ).length || 3;

          currentSlide.textContent = this.realIndex + 1;
        },

        slideChange: function () {
          currentSlide.textContent = this.realIndex + 1;
        }
      }
    });
  </script>
</body>
</html>
