<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>로그인</title>

    <style>
        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        input,
        button {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           모바일 앱 전용 화면
        ========================= */

        .login-page {
            position: relative;
            width: 100%;
            height: 844px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           제목 영역
        ========================= */

        .title-area {
            position: absolute;
            top: 62px;
            left: 20px;
            right: 20px;
            text-align: center;
        }

        .title-area h1 {
            color: #111111;
            font-size: 35px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .title-area p {
            margin-top: 39px;
            color: #858585;
            font-size: 22px;
            line-height: 1.55;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        /* =========================
           로그인 폼
        ========================= */

        .login-form {
            position: absolute;
            top: 246px;
            left: 20px;
            right: 20px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 69px;
            border: 1px solid #dedede;
            border-radius: 15px;
            background-color: #ffffff;
        }

        .input-box + .input-box {
            margin-top: 11px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            padding: 0 52px 0 19px;
            border: 0;
            outline: 0;
            border-radius: 15px;
            background-color: transparent;
            color: #4f4f4f;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .input-box input::placeholder {
            color: #c6c6c6;
            opacity: 1;
        }

        .eye-button {
            position: absolute;
            top: 50%;
            right: 17px;
            width: 24px;
            height: 24px;
            padding: 0;
            background-color: transparent;
            transform: translateY(-50%);
        }

        .eye-button img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =========================
           로그인 상태 유지
        ========================= */

        .keep-login {
            display: flex;
            align-items: center;
            margin-top: 38px;
        }

        .keep-login input {
            position: absolute;
            opacity: 0;
        }

        .keep-login label {
            position: relative;
            padding-left: 45px;
            color: #858585;
            font-size: 22px;
            line-height: 26px;
            font-weight: 700;
            letter-spacing: -0.7px;
            cursor: pointer;
        }

        .keep-login label::before {
            content: "";
            position: absolute;
            top: 1px;
            left: 1px;
            width: 18px;
            height: 18px;
            border: 2px solid #8b8b8b;
            border-radius: 3px;
            background-color: #ffffff;
        }

        .keep-login input:checked + label::before {
            border-color: #49a978;
            background-color: #49a978;
        }

        .keep-login input:checked + label::after {
            content: "";
            position: absolute;
            top: 5px;
            left: 7px;
            width: 6px;
            height: 10px;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
        }

        /* =========================
           로그인 버튼
        ========================= */

        .login-button {
            display: block;
            width: 100%;
            height: 78px;
            margin-top: 40px;
            border-radius: 15px;
            background-color: #48a778;
            color: #ffffff;
            font-size: 33px;
            line-height: 78px;
            font-weight: 800;
            text-align: center;
            letter-spacing: -1px;
        }

        /* =========================
           또는 구분선
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 45px;
            color: #858585;
            font-size: 21px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #d7d7d7;
        }

        .divider span {
            margin: 0 22px;
        }

        /* =========================
           소셜 로그인
        ========================= */

        .social-login {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 38px;
            margin-top: 24px;
        }

        .social-login a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 78px;
            height: 78px;
            border: 3px solid #eeeeee;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .social-login img {
            display: block;
            width: 43px;
            height: 43px;
            object-fit: contain;
        }

        /* =========================
           회원가입 문구
        ========================= */

        .signup-message {
            margin-top: 40px;
            color: #858585;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
        }

        .signup-message a {
            color: #ff6678;
        }

        /* 접근성 숨김 */
        .blind {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>

    <main class="login-page">

        <!-- 제목 -->
        <section class="title-area">
            <h1>로그인</h1>

            <p>
                반려동물의 건강을<br>
                함께 지켜주세요.
            </p>
        </section>

        <!-- 로그인 폼 -->
        <form class="login-form" action="#" method="post">

            <!-- 아이디 -->
            <div class="input-box">
                <label class="blind" for="user-id">아이디</label>

                <input
                    type="text"
                    id="user-id"
                    name="userId"
                    value="gunks5000"
                    placeholder="아이디"
                    autocomplete="username"
                >
            </div>

            <!-- 비밀번호 -->
            <div class="input-box">
                <label class="blind" for="user-password">비밀번호</label>

                <input
                    type="password"
                    id="user-password"
                    name="userPassword"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="eye-button"
                    aria-label="비밀번호 보기"
                >
                    <img
                        src="./images/eye-icon.png"
                        alt=""
                    >
                </button>
            </div>

            <!-- 로그인 상태 유지 -->
            <div class="keep-login">
                <input
                    type="checkbox"
                    id="keep-login"
                    name="keepLogin"
                >

                <label for="keep-login">
                    로그인 상태 유지
                </label>
            </div>

            <!-- 로그인 -->
            <button type="submit" class="login-button">
                로그인
            </button>

            <!-- 구분선 -->
            <div class="divider">
                <span>또는</span>
            </div>

            <!-- 소셜 로그인 -->
            <div class="social-login">

                <a href="#" aria-label="카카오로 로그인">
                    <img
                        src="./kakao.svg"
                        alt=""
                    >
                </a>

                <a href="#" aria-label="구글로 로그인">
                    <img
                        src="./google.svg"
                        alt=""
                    >
                </a>

                <a href="#" aria-label="애플로 로그인">
                    <img
                        src="./apple.svg"
                        alt=""
                    >
                </a>

            </div>

            <!-- 회원가입 -->
            <p class="signup-message">
                계정이 없으신가요?
                <a href="./    ">회원가입</a>
            </p>

        </form>

    </main>

</body>
</html>
