<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 앱 화면 크기 설정 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>PetCare 스플래시</title>

    <style>
        /* ========================================
           기본 초기화
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #198754;
            font-family:
                Pretendard,
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                Arial,
                sans-serif;
        }

        /* ========================================
           모바일 앱 스플래시 화면
           기준 시안: 390 × 844px
        ======================================== */
        .splash-screen {
            position: relative;
            width: 100%;
            height: 844px;
            min-height: 844px;
            overflow: hidden;
            background-color: #198754;
            color: #ffffff;
        }

        /* ========================================
           중앙 콘텐츠 영역
        ======================================== */
        .splash-content {
            position: absolute;
            top: 171px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        /* ========================================
           큰 발바닥 로고
        ======================================== */
        .main-paw {
            position: relative;
            width: 136px;
            height: 123px;
            margin: 0 auto;
        }

        .main-paw .toe,
        .main-paw .pad {
            position: absolute;
            display: block;
            background-color: #ffffff;
        }

        /* 왼쪽 발가락 */
        .main-paw .toe-1 {
            top: 32px;
            left: 0;
            width: 34px;
            height: 42px;
            border-radius: 50%;
            transform: rotate(-18deg);
        }

        /* 왼쪽 위 발가락 */
        .main-paw .toe-2 {
            top: 0;
            left: 31px;
            width: 34px;
            height: 43px;
            border-radius: 50%;
            transform: rotate(-7deg);
        }

        /* 오른쪽 위 발가락 */
        .main-paw .toe-3 {
            top: 0;
            right: 31px;
            width: 34px;
            height: 43px;
            border-radius: 50%;
            transform: rotate(7deg);
        }

        /* 오른쪽 발가락 */
        .main-paw .toe-4 {
            top: 32px;
            right: 0;
            width: 34px;
            height: 42px;
            border-radius: 50%;
            transform: rotate(18deg);
        }

        /* 발바닥 중앙 패드 */
        .main-paw .pad {
            left: 21px;
            bottom: 0;
            width: 94px;
            height: 77px;
            border-radius: 49% 49% 32% 32% / 58% 58% 40% 40%;
        }

        /* 중앙 아래쪽 홈 표현 */
        .main-paw .pad::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1px;
            width: 27px;
            height: 17px;
            background-color: #198754;
            border-radius: 50% 50% 0 0;
            transform: translateX(-50%);
        }

        /* ========================================
           브랜드 타이틀
        ======================================== */
        .brand-title {
            margin-top: 31px;
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2.5px;
        }

        .brand-subtitle {
            margin-top: 7px;
            font-size: 31px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -1.8px;
        }

        /* ========================================
           메인 안내 문구
        ======================================== */
        .splash-message {
            margin-top: 58px;
            font-size: 23px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -1px;
        }

        /* ========================================
           하단 로딩 영역
        ======================================== */
        .loading-area {
            position: absolute;
            left: 50%;
            bottom: 55px;
            width: 90px;
            transform: translateX(-50%);
            text-align: center;
        }

        /* 작은 발바닥 아이콘 */
        .small-paw {
            position: relative;
            width: 36px;
            height: 34px;
            margin: 0 auto 19px;
        }

        .small-paw .toe,
        .small-paw .pad {
            position: absolute;
            display: block;
            background-color: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .small-paw .toe-1 {
            top: 9px;
            left: 0;
            width: 9px;
            height: 12px;
            border-radius: 50%;
            transform: rotate(-18deg);
        }

        .small-paw .toe-2 {
            top: 0;
            left: 8px;
            width: 9px;
            height: 12px;
            border-radius: 50%;
        }

        .small-paw .toe-3 {
            top: 0;
            right: 8px;
            width: 9px;
            height: 12px;
            border-radius: 50%;
        }

        .small-paw .toe-4 {
            top: 9px;
            right: 0;
            width: 9px;
            height: 12px;
            border-radius: 50%;
            transform: rotate(18deg);
        }

        .small-paw .pad {
            left: 7px;
            bottom: 0;
            width: 22px;
            height: 19px;
            border-radius: 50% 50% 35% 35%;
        }

        .small-paw .pad::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1px;
            width: 7px;
            height: 5px;
            border-radius: 50% 50% 0 0;
            background-color: #198754;
            transform: translateX(-50%);
        }

        /* 로딩 바 */
        .loading-bar {
            position: relative;
            width: 70px;
            height: 7px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.55);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .loading-progress {
            width: 50%;
            height: 100%;
            border-radius: 20px 0 0 20px;
            background-color: #ffffff;
        }
    </style>
</head>

<body>
    <main class="splash-screen">

        <!-- 중앙 로고 및 브랜드 영역 -->
        <section class="splash-content">

            <!-- 큰 발바닥 로고 -->
            <div class="main-paw" aria-hidden="true">
                <span class="toe toe-1"></span>
                <span class="toe toe-2"></span>
                <span class="toe toe-3"></span>
                <span class="toe toe-4"></span>
                <span class="pad"></span>
            </div>

            <!-- 브랜드명 -->
            <h1 class="brand-title">PetCare</h1>

            <!-- 브랜드 설명 -->
            <p class="brand-subtitle">반려동물 건강관리</p>

            <!-- 안내 문구 -->
            <p class="splash-message">
                사랑하는 아이의<br>
                건강을 지켜주세요
            </p>
        </section>

        <!-- 하단 로딩 영역 -->
        <div class="loading-area">

            <!-- 작은 발바닥 -->
            <div class="small-paw" aria-hidden="true">
                <span class="toe toe-1"></span>
                <span class="toe toe-2"></span>
                <span class="toe toe-3"></span>
                <span class="toe toe-4"></span>
                <span class="pad"></span>
            </div>

            <!-- 로딩 진행 표시 -->
            <div class="loading-bar" aria-label="로딩 중">
                <div class="loading-progress"></div>
            </div>
        </div>

    </main>
    <script>
        // ======================================
// Splash → Onboarding01 자동 이동
// 3초 후 페이지 이동
// ======================================

window.addEventListener("load", function () {

    setTimeout(function () {

        // 온보딩 첫 번째 화면으로 이동
        window.location.href = "./onb1.html";

    }, 3000);

});
    </script>
</body>
</html>
