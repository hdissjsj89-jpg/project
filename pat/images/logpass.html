<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>PetCare 로그인</title>

    <style>
        /* ========================================
           기본 초기화
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #333333;
            font-family:
                Pretendard,
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                Arial,
                sans-serif;
        }

        input,
        button {
            border: 0;
            outline: none;
            background: none;
            color: inherit;
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        a,
        label {
            -webkit-tap-highlight-color: transparent;
        }

        img {
            display: block;
        }

        /* ========================================
           모바일 앱 전용 화면
           기존 100vh 대신 100svh 사용
        ======================================== */
        .login-screen {
            position: relative;
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ========================================
           상단 제목 영역
        ======================================== */
        .login-header {
            position: absolute;
            top: 64px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            text-align: center;
        }

        .login-title {
            color: #111111;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -2px;
        }

        .login-description {
            margin-top: 40px;
            color: #888888;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: -1px;
        }

        /* ========================================
           로그인 폼 영역
        ======================================== */
        .login-form {
            position: absolute;
            top: 244px;
            left: 20px;
            width: calc(100% - 40px);
        }

        .input-group {
            width: 100%;
            height: 70px;
            margin-bottom: 10px;
        }

        .login-input {
            width: 100%;
            height: 100%;
            padding: 0 20px;
            border: 1px solid #dddddd;
            border-radius: 16px;
            background-color: #ffffff;
            color: #3e3e3e;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .login-input::placeholder {
            color: #c8c8c8;
            opacity: 1;
        }

        .login-input:focus {
            border-color: #49a477;
        }

        .password-input {
            color: #252525;
            font-size: 27px;
            letter-spacing: 1px;
        }

        /* ========================================
           로그인 상태 유지
        ======================================== */
        .remember-area {
            display: flex;
            align-items: center;
            margin-top: 31px;
        }

        .remember-checkbox {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
        }

        .checkbox-design {
            position: relative;
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            margin-right: 13px;
            border: 2px solid #8f8f8f;
            border-radius: 3px;
            background-color: #ffffff;
            cursor: pointer;
        }

        .remember-checkbox:checked + .checkbox-design {
            border-color: #49a477;
            background-color: #49a477;
        }

        .remember-checkbox:checked + .checkbox-design::after {
            content: "";
            position: absolute;
            top: 1px;
            left: 5px;
            width: 4px;
            height: 9px;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
        }

        .remember-text {
            color: #8b8b8b;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.6px;
            cursor: pointer;
        }

        /* ========================================
           로그인 및 회원가입 버튼
        ======================================== */
        .action-buttons {
            width: 100%;
            margin-top: 38px;
        }

        .login-button,
        .signup-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* 로그인 성공 후 홈 화면 이동 */
        .login-button {
            background-color: #49a477;
            color: #ffffff;
        }

        .login-button:active {
            background-color: #3e936a;
        }

        /* 회원가입 화면 이동 */
        .signup-button {
            margin-top: 9px;
            border: 2px solid #2da56f;
            background-color: #ffffff;
            color: #2da56f;
        }

        .signup-button:active {
            background-color: #f3fbf7;
        }

        /* ========================================
           또는 구분선
        ======================================== */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 27px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background-color: #d3d3d3;
        }

        .divider-text {
            margin: 0 23px;
            color: #7f7f7f;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        /* ========================================
           소셜 로그인 영역
        ======================================== */
        .social-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 37px;
            margin-top: 24px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 78px;
            height: 78px;
            border: 3px solid #e6e6e6;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .social-button:active {
            background-color: #f7f7f7;
        }

        .social-icon {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .social-button.kakao .social-icon {
            width: 39px;
            height: 39px;
        }

        .social-button.google .social-icon {
            width: 38px;
            height: 38px;
        }

        .social-button.apple .social-icon {
            width: 43px;
            height: 43px;
        }

        /* ========================================
           하단 회원가입 안내
        ======================================== */
        .signup-guide {
            margin-top: 40px;
            color: #777777;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .signup-question {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .signup-link {
            margin-left: 3px;
            color: #ff5c7a;
        }
    </style>
</head>

<body>
    <main class="login-screen">

        <!-- 로그인 제목 -->
        <header class="login-header">
            <h1 class="login-title">로그인</h1>

            <p class="login-description">
                반려동물의 건강을<br>
                함께 지켜주세요.
            </p>
        </header>

        <!-- 로그인 폼 -->
        <form
            class="login-form"
            action="./home.html"
            method="get"
        >

            <!-- 아이디 입력 완료 상태 -->
            <div class="input-group">
                <input
                    type="text"
                    name="userId"
                    class="login-input"
                    value="gunks5000"
                    autocomplete="username"
                    aria-label="아이디"
                    required
                >
            </div>

            <!-- 비밀번호 입력 완료 상태 -->
            <div class="input-group">
                <input
                    type="password"
                    name="password"
                    class="login-input password-input"
                    value="123456789"
                    autocomplete="current-password"
                    aria-label="비밀번호"
                    required
                >
            </div>

            <!-- 로그인 상태 유지 -->
            <div class="remember-area">
                <input
                    type="checkbox"
                    id="rememberLogin"
                    name="rememberLogin"
                    class="remember-checkbox"
                >

                <label
                    for="rememberLogin"
                    class="checkbox-design"
                    aria-hidden="true"
                ></label>

                <label
                    for="rememberLogin"
                    class="remember-text"
                >
                    로그인 상태 유지
                </label>
            </div>

            <!-- 로그인 및 회원가입 이동 버튼 -->
            <div class="./home.html">

                <!-- 아이디와 비밀번호 입력 후 홈 화면으로 이동 -->
                <button
                    type="submit"
                    class="login-button"
                >
                    로그인
                </button>

                <!-- 회원가입 페이지로 이동 -->
                <a
                    href="./mamber1.html"
                    class="signup-button"
                >
                    회원가입
                </a>

            </div>

            <!-- 또는 구분선 -->
            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">또는</span>
                <span class="divider-line"></span>
            </div>

            <!-- 소셜 로그인 -->
            <div class="social-login">

                <!-- 카카오 로그인 페이지 -->
                <a
                    href="./kakao-login.html"
                    class="social-button kakao"
                    aria-label="카카오 로그인"
                >
                    <img
                        src="./icons/icon-kakao.svg"
                        alt=""
                        class="social-icon"
                    >
                </a>

                <!-- 구글 로그인 페이지 -->
                <a
                    href="./google-login.html"
                    class="social-button google"
                    aria-label="구글 로그인"
                >
                    <img
                        src="./icons/icon-google.svg"
                        alt=""
                        class="social-icon"
                    >
                </a>

                <!-- 애플 로그인 페이지 -->
                <a
                    href="./apple-login.html"
                    class="social-button apple"
                    aria-label="애플 로그인"
                >
                    <img
                        src="./icons/icon-apple.svg"
                        alt=""
                        class="social-icon"
                    >
                </a>

            </div>

            <!-- 하단 회원가입 안내 -->
            <p class="signup-guide">
                <span class="signup-question">
                    계정이 없으신가요?
                </span>

                <a
                    href="./signup.html"
                    class="signup-link"
                >
                    회원가입
                </a>
            </p>

        </form>

    </main>
</body>
</html>
