<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한국 영재 올림피아드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-top: 14px;
      background-color: #ffffff;
      font-family: "맑은 고딕", Arial, sans-serif;
    }

    .olympiad-box {
      width: 640px;
      margin: 0 auto;
      padding: 42px 20px 16px;
      border: 2px solid red;
      background-color: #ffffff;
    }

    h1 {
      margin: 0 0 23px;
      padding: 15px 10px;
      background-color: yellow;
      color: #000000;
      font-size: 32px;
      line-height: 1.2;
      text-align: center;
    }

    .intro-link {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.5;
    }

    .intro-link a {
      color: blue;
      text-decoration: none;
    }

    .guide-text {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    h2 {
      margin: 0 0 18px;
      padding: 9px 10px;
      background-color: #d3d3d3;
      color: #000000;
      font-size: 24px;
      font-weight: normal;
      line-height: 1.3;
      text-align: center;
    }

    ul {
      margin: 0 0 35px;
      padding-left: 39px;
    }

    li {
      font-size: 16px;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 37px;
      font-size: 13px;
      line-height: 1.7;
    }

    .cheer {
      margin: 0 0 31px;
      font-size: 13px;
      line-height: 1.7;
    }

    .button-area {
      display: flex;
      gap: 4px;
    }

    .event-button {
      display: inline-block;
      padding: 5px 7px;
      background-color: purple;
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="olympiad-box">
    <h1>한국 영재 올림피아드</h1>

    <p class="intro-link">
      <a href="#">
        한국 영재 올림피아드(Korea Olympiad for the Gifted Students)는...
      </a>
    </p>

    <p class="guide-text">
      (↑ 클릭하면 자세한 설명으로 이동합니다.)
    </p>

    <h2>대회 개요</h2>

    <ul>
      <li>대회일시</li>
      <li>대회일시</li>
      <li>대회일시</li>
    </ul>

    <p class="description">
      한국 영재 올림피아드에 참가하는 학생 여러분들을 진심으로 환영하며
      격려를 아끼지 않습니다.
    </p>

    <p class="cheer">
      과학에 관심있고 재능있는 여러분들의 도전을 응원하겠습니다!!
    </p>

    <div class="button-area">
      <a href="#" class="event-button">이벤트</a>
      <a href="#" class="event-button">이벤트</a>
      <a href="#" class="event-button">이벤트</a>
    </div>
  </div>
</body>
</html>
