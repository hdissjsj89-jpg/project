<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA 온보딩 두 번째 화면</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        /* 모바일 앱 전체 화면 */
        .onboarding {
            position: relative;
            width: 100%;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 상단 안내 문구 */
        .message {
            position: absolute;
            top: 234px;
            left: 24px;
            right: 24px;
            color: #96a9d6;
            font-size: 17px;
            line-height: 1.5;
            font-weight: 600;
            letter-spacing: -0.7px;
            text-align: left;
            word-break: keep-all;
        }

        /* 일러스트 영역 */
        .visual-area {
            position: absolute;
            top: 332px;
            left: 0;
            width: 100%;
            height: 310px;
            overflow: hidden;
        }

        /* 이미지 뒤 연한 배경 도형 */
        .background-shape {
            position: absolute;
            top: 0;
            left: -35px;
            width: 450px;
            height: 245px;
            border-radius: 48% 52% 42% 58%;
            background-color: #f0f2fa;
            transform: rotate(4deg);
        }

        /* 곰 캐릭터 이미지 */
        .visual-area img {
            position: absolute;
            top: 27px;
            left: 71px;
            width: 245px;
            height: auto;
            object-fit: contain;
            z-index: 2;
        }

        /* 페이지 표시 점 */
        .pagination {
            position: absolute;
            top: 664px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(-50%);
        }

        .dot {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #edf0f8;
        }

        .dot.active {
            background-color: #5875bb;
        }

        /* 시작하기 버튼 */
        .start-button {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 34px;
            height: 49px;
            border-radius: 11px;
            background-color: #5875b8;
            color: #ffffff;
            font-size: 15px;
            line-height: 49px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        /* 하단 홈 인디케이터 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            width: 134px;
            height: 5px;
            border-radius: 5px;
            background-color: #000000;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <main class="onboarding">

        <!-- 상단 안내 문구 -->
        <p class="message">
            차박에 필요한 물품들을 용도별로 둘러봐요
        </p>

        <!-- 중앙 일러스트 -->
        <section class="visual-area">

            <span class="background-shape"></span>

            <img
                src="./images/work2.png"
                alt="차박 준비물을 들고 이동하는 곰 캐릭터"
            >

        </section>

        <!-- 두 번째 온보딩 페이지 표시 -->
        <div class="pagination" aria-label="온보딩 두 번째 화면">

            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>

        </div>

        <!-- 다음 화면 이동 -->
        <a href="./login.html" class="start-button">
            시작하기
        </a>

        <!-- 하단 홈 인디케이터 -->
        <div class="home-indicator"></div>

    </main>
<script>
 // 3초(3000ms) 후 onboarding3.html로 자동 이동
        setTimeout(function () {
            window.location.href = "./onboding3.html";
        }, 3000);
</script>
</body>
</html>
