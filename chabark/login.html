<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBAK 로그인</title>

    <style>
        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           모바일 전용 앱 화면
        ========================= */

        .login-page {
            position: relative;
            width: 100%;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           로고
        ========================= */

        .logo-area {
            position: absolute;
            top: 101px;
            left: 50%;
            width: 132px;
            transform: translateX(-50%);
            text-align: center;
        }

        .logo-area img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* =========================
           로그인 폼
        ========================= */

        .login-form {
            position: absolute;
            top: 246px;
            left: 24px;
            right: 24px;
        }

        .input-group {
            position: relative;
            width: 100%;
            height: 68px;
            border-bottom: 1px solid #d7d7d7;
        }

        .input-group + .input-group {
            margin-top: 0;
        }

        .input-group input {
            width: 100%;
            height: 100%;
            border: 0;
            outline: 0;
            background-color: transparent;
            color: #314f91;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .input-group input::placeholder {
            color: #4160a8;
            opacity: 1;
        }

        /* 자동완성 배경 제거 */
        .input-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #ffffff inset;
            -webkit-text-fill-color: #314f91;
        }

        /* =========================
           버튼 영역
        ========================= */

        .button-area {
            margin-top: 32px;
        }

        .login-button,
        .signup-button {
            display: block;
            width: 100%;
            height: 49px;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            line-height: 49px;
            text-align: center;
        }

        .login-button {
            background-color: #5875ba;
            color: #ffffff;
        }

        .signup-button {
            margin-top: 8px;
            border: 1px solid #5875ba;
            background-color: #ffffff;
            color: #4163ad;
        }

        /* =========================
           계정 찾기 메뉴
        ========================= */

        .account-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            color: #49649e;
            font-size: 13px;
            line-height: 20px;
            letter-spacing: -0.4px;
        }

        .account-menu a {
            display: inline-block;
        }

        .account-menu span {
            margin: 0 13px;
            color: #91a2c8;
        }

        /* =========================
           간편 로그인 구분선
        ========================= */

        .simple-login-title {
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 30px;
            color: #5270af;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }

        .simple-login-title::before,
        .simple-login-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #7890c1;
        }

        .simple-login-title::before {
            margin-right: 14px;
        }

        .simple-login-title::after {
            margin-left: 14px;
        }

        /* =========================
           SNS 로그인
        ========================= */

        .social-login {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            margin-top: 24px;
        }

        .social-login a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .social-login img {
            display: block;
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* =========================
           화면 낭독기용 숨김 텍스트
        ========================= */

        .blind {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>

    <main class="login-page">

        <!-- 로고 -->
        <h1 class="logo-area">
            <img
                src="./images/logo.svg"
                alt="CAMBAK"
            >
        </h1>

        <!-- 로그인 입력 영역 -->
        <form class="login-form" action="#" method="post">

            <div class="input-group">
                <label class="blind" for="user-id">아이디</label>

                <input
                    type="text"
                    id="user-id"
                    name="userId"
                    placeholder="아이디"
                    autocomplete="username"
                >
            </div>

            <div class="input-group">
                <label class="blind" for="user-password">비밀번호</label>

                <input
                    type="password"
                    id="user-password"
                    name="userPassword"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                >
            </div>

            <!-- 로그인 및 회원가입 -->
            <div class="button-area">

                <button type="submit" class="login-button">
                    로그인
                </button>

                <a href="./signup.html" class="signup-button">
                    회원가입
                </a>

            </div>

            <!-- 계정 관련 메뉴 -->
            <nav class="account-menu" aria-label="계정 찾기 메뉴">

                <a href="./find-id.html">아이디 찾기</a>

                <span aria-hidden="true">|</span>

                <a href="./find-password.html">비밀번호 찾기</a>

                <span aria-hidden="true">|</span>

                <a href="./browse.html">둘러보기</a>

            </nav>

            <!-- 간편 로그인 제목 -->
            <p class="simple-login-title">
                간편로그인
            </p>

            <!-- 간편 로그인 아이콘 -->
            <div class="social-login">

                <a href="#" aria-label="카카오로 로그인">
                    <img
                        src="./images/download_kakaotalk_logo.svg.png"
                        alt=""
                    >
                </a>

                <a href="#" aria-label="네이버로 로그인">
                    <img
                        src="./images/naver.png"
                        alt=""
                    >
                </a>

                <a href="#" aria-label="구글로 로그인">
                    <img
                        src="./images/google.png"
                        alt=""
                    >
                </a>

                <a href="#" aria-label="페이스북으로 로그인">
                    <img
                        src="./images/facebook.png"
                        alt=""
                    >
                </a>

            </div>

        </form>

    </main>

</body>
</html>
