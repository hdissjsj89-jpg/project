<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>홈</title>

    <!-- 아이콘 이미지 파일 없이 사용하는 Bootstrap Icons 주소 -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        /* ========================================
           기본 설정
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #222222;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
        }

        button {
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            cursor: pointer;
        }

        /* ========================================
           모바일 앱 전체 영역
        ======================================== */

        .app {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ========================================
           세로 스크롤 영역
        ======================================== */

        .scroll-area {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            padding-bottom: 105px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .scroll-area::-webkit-scrollbar {
            display: none;
        }

        /* ========================================
           상단 메인 이미지
        ======================================== */

        .hero {
            position: relative;
            width: 100%;
            height: 285px;
            overflow: hidden;
            background-color: #e8edf1;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ========================================
           상태바
        ======================================== */

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            width: 100%;
            height: 44px;
            color: #000000;
        }

        .status-time {
            position: absolute;
            top: 13px;
            left: 32px;
            font-size: 15px;
            line-height: 18px;
            font-weight: 800;
        }

        .status-icons {
            position: absolute;
            top: 13px;
            right: 17px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 17px;
        }

        .status-icons .bi-battery-full {
            font-size: 21px;
        }

        /* ========================================
           공통 콘텐츠
        ======================================== */

        .inner {
            padding-right: 24px;
            padding-left: 24px;
        }

        .section-title {
            color: #4e6db8;
            font-size: 19px;
            line-height: 28px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }

        /* ========================================
           테마별 카테고리
        ======================================== */

        .category-section {
            padding-top: 24px;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 23px;
            margin-top: 22px;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .category-emoji {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 43px;
            height: 43px;
            font-size: 31px;
            line-height: 1;
        }

        .category-name {
            margin-top: 6px;
            color: #666666;
            font-size: 14px;
            line-height: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ========================================
           쿠폰·이벤트·혜택
        ======================================== */

        .quick-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 22px;
        }

        .quick-menu a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            border-radius: 9px;
            background-color: #f0f3fa;
            color: #4e69ad;
            font-size: 15px;
            font-weight: 800;
        }

        .quick-menu i {
            font-size: 20px;
        }

        /* ========================================
           장소 랭킹
        ======================================== */

        .ranking-section {
            padding-top: 22px;
        }

        .ranking-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .ranking-card {
            position: relative;
            display: block;
            height: 204px;
            overflow: hidden;
            background-color: #661010;
        }

        .ranking-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 이미지가 없을 때 순위 숫자 표시 */
        .ranking-number {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 31px;
            height: 31px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            color: #4e6db8;
            font-size: 15px;
            font-weight: 800;
        }

        /* ========================================
           추천 장소 카드
        ======================================== */

        .place-section {
            padding-top: 24px;
        }

        .place-image-link {
            display: block;
            width: 100%;
            height: 196px;
            overflow: hidden;
            background-color: #eeeeee;
        }

        .place-image-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-info {
            position: relative;
            padding-top: 24px;
        }

        .place-title {
            padding-right: 45px;
            color: #222222;
            font-size: 18px;
            line-height: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 북마크 */
        .bookmark-link {
            position: absolute;
            top: 19px;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            color: #4e70bd;
            font-size: 25px;
        }

        .place-address {
            margin-top: 20px;
            color: #727272;
            font-size: 13px;
            line-height: 20px;
            font-weight: 500;
        }

        /* ========================================
           장소 버튼
        ======================================== */

        .place-buttons {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 18px;
            margin-top: 21px;
            padding-bottom: 16px;
        }

        .place-buttons a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 49px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 20px;
            font-weight: 800;
        }

        .direction-button {
            background-color: #4e70bd;
            color: #ffffff;
        }

        .remove-button {
            border: 1px solid #4e70bd;
            background-color: #ffffff;
            color: #222222;
        }

        /* ========================================
           하단 고정 메뉴
        ======================================== */

        .bottom-navigation {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 20;
            width: 100%;
            height: 91px;
            border-top: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .bottom-menu {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            height: 70px;
        }

        .bottom-menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #111111;
        }

        .bottom-menu i {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            font-size: 24px;
            line-height: 1;
        }

        .nav-name {
            margin-top: 3px;
            font-size: 14px;
            line-height: 18px;
            font-weight: 700;
        }

        .bottom-menu a.active {
            color: #4e70bd;
        }

        /* 아이폰 하단 홈 인디케이터 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            width: 134px;
            height: 5px;
            border-radius: 5px;
            background-color: #000000;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- 세로 스크롤 영역 -->
        <div class="scroll-area">

            <!-- 상단 메인 이미지 -->
            <section class="hero">

                <img
                    src="./images/121.svg"
                    alt="캠핑카를 운전하는 곰 캐릭터"
                    class="hero-image"
                >

                <!-- 상태바 -->
                <div class="status-bar">

                    <span class="status-time">9:41</span>

                    <div class="status-icons">
                        <i class="bi bi-reception-4"></i>
                        <i class="bi bi-wifi"></i>
                        <i class="bi bi-battery-full"></i>
                    </div>

                </div>

            </section>

            <!-- 테마별 카테고리 -->
            <section class="inner category-section">

                <h1 class="section-title">테마별 카테고리</h1>

                <div class="category-list">

                    <a href="./category-flower.html" class="category-item">
                        <span class="category-emoji">🌷</span>
                        <span class="category-name">꽃놀이</span>
                    </a>

                    <a href="./category-fire.html" class="category-item">
                        <span class="category-emoji">🔥</span>
                        <span class="category-name">불멍</span>
                    </a>

                    <a href="./category-city.html" class="category-item">
                        <span class="category-emoji">🏙️</span>
                        <span class="category-name">도심</span>
                    </a>

                    <a href="./category-star.html" class="category-item">
                        <span class="category-emoji">🌌</span>
                        <span class="category-name">별감상</span>
                    </a>

                    <a href="./category-pet.html" class="category-item">
                        <span class="category-emoji">🐕</span>
                        <span class="category-name">반려견</span>
                    </a>

                    <a href="./category-nature.html" class="category-item">
                        <span class="category-emoji">🏔️</span>
                        <span class="category-name">오지</span>
                    </a>

                    <a href="./category-bbq.html" class="category-item">
                        <span class="category-emoji">♨️</span>
                        <span class="category-name">바베큐</span>
                    </a>

                    <a href="./category-equipment.html" class="category-item">
                        <span class="category-emoji">⛺</span>
                        <span class="category-name">장비</span>
                    </a>

                </div>

                <!-- 빠른 메뉴 -->
                <div class="quick-menu">

                    <a href="./coupon.html">
                        <i class="bi bi-ticket-perforated-fill"></i>
                        <span>쿠폰</span>
                    </a>

                    <a href="./event.html">
                        <i class="bi bi-stars"></i>
                        <span>이벤트</span>
                    </a>

                    <a href="./benefit.html">
                        <i class="bi bi-gift-fill"></i>
                        <span>혜택</span>
                    </a>

                </div>

            </section>

            <!-- 장소 랭킹 -->
            <section class="inner ranking-section">

                <h2 class="section-title">장소 랭킹 Top 10</h2>

                <div class="ranking-grid">

                    <a href="./place-detail01.html" class="ranking-card">
                        <!-- 랭킹 이미지가 있으면 아래 경로에 저장 -->
                        <!--
                        <img
                            src="./immages/main1.png"
                            alt="장소 랭킹 1위"
                        >
                        -->
                        <span class="ranking-number">1</span>
                    </a>

                    <a href="./place-detail02.html" class="ranking-card">
                        <!--
                        <img
                            src="./images/ranking02.png"
                            alt="장소 랭킹 2위"
                        >
                        -->
                        <span class="ranking-number">2</span>
                    </a>

                </div>

            </section>

            <!-- 추천 장소 카드 -->
            <section class="inner place-section">

                <a
                    href="./place-detail.html"
                    class="place-image-link"
                >
                    <img
                        src="./images/main3.png"
                        alt="숲속 텐트와 해먹이 있는 캠핑 장소"
                    >
                </a>

                <div class="place-info">

                    <h2 class="place-title">
                        테마별 카테고리
                    </h2>

                    <!-- 북마크 페이지 이동 -->
                    <a
                        href="./bookmark.html"
                        class="bookmark-link"
                        aria-label="북마크 페이지로 이동"
                    >
                        <i class="bi bi-bookmark"></i>
                    </a>

                    <p class="place-address">
                        강원도 원주시 치악면 치악산 1번지
                    </p>

                    <div class="place-buttons">

                        <!-- 길찾기 페이지 이동 -->
                        <a
                            href="./directions.html"
                            class="direction-button"
                        >
                            <i class="bi bi-geo-alt-fill"></i>
                            <span>길찾기</span>
                        </a>

                        <!-- 저장 해제 페이지 이동 -->
                        <a
                            href="./bookmark-remove.html"
                            class="remove-button"
                        >
                            <i class="bi bi-bookmark-x"></i>
                            <span>해제하기</span>
                        </a>

                    </div>

                </div>

            </section>

        </div>

        <!-- 하단 고정 내비게이션 -->
        <nav class="bottom-navigation" aria-label="하단 메뉴">

            <div class="bottom-menu">

                <!-- 홈 -->
                <a href="./home.html" class="active">
                    <i class="bi bi-house"></i>
                    <span class="nav-name">홈</span>
                </a>

                <!-- 검색 -->
                <a href="./icons/icons/search.svg">
                    <i class="bi bi-search"></i>
                    <span class="nav-name">검색</span>
                </a>

                <!-- 모임 -->
                <a href="./community.html">
                    <i class="bi bi-people"></i>
                    <span class="nav-name">모임</span>
                </a>

                <!-- 라이브 -->
                <a href="./live.html">
                    <i class="bi bi-tv"></i>
                    <span class="nav-name">LIVE</span>
                </a>

                <!-- 마이페이지 -->
                <a href="./mypage.html">
                    <i class="bi bi-person"></i>
                    <span class="nav-name">MY</span>
                </a>

            </div>

            <div class="home-indicator"></div>

        </nav>

    </main>

</body>
</html>
