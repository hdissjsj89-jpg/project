<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA 온보딩 세 번째 화면</title>

    <style>
        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           모바일 앱 전체 화면
        ========================= */

        .onboarding {
            position: relative;
            width: 100%;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           상단 제목 영역
        ========================= */

        .content {
            position: absolute;
            top: 101px;
            left: 24px;
            right: 24px;
            z-index: 3;
        }

        .content h1 {
            color: #344c84;
            font-size: 29px;
            line-height: 1.28;
            font-weight: 800;
            letter-spacing: -1.2px;
            word-break: keep-all;
        }

        .content h1 .small-title {
            display: block;
            margin-bottom: 1px;
            color: #6c85c0;
            font-size: 23px;
            line-height: 1.3;
            font-weight: 700;
            letter-spacing: -0.9px;
        }

        .content h1 .light-text {
            color: #6c85c0;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .content p {
            width: 325px;
            margin-top: 25px;
            color: #91a7d8;
            font-size: 17px;
            line-height: 1.5;
            font-weight: 500;
            letter-spacing: -0.6px;
            word-break: keep-all;
        }

        /* =========================
           중앙 일러스트 영역
        ========================= */

        .visual-area {
            position: absolute;
            top: 376px;
            left: 0;
            width: 100%;
            height: 260px;
            overflow: hidden;
        }

        /* 이미지 뒤 연한 배경 도형 */
        .background-shape {
            position: absolute;
            top: 4px;
            left: -105px;
            width: 440px;
            height: 205px;
            border-radius: 0 48% 48% 0;
            background-color: #f0f2fa;
            transform: rotate(2deg);
        }

        /* 캐릭터 이미지 */
        .visual-area img {
            position: absolute;
            top: 0;
            left: 70px;
            width: 245px;
            height: auto;
            object-fit: contain;
            z-index: 2;
        }

        /* =========================
           페이지 표시 점
        ========================= */

        .pagination {
            position: absolute;
            top: 664px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(-50%);
        }

        .dot {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #edf0f8;
        }

        .dot.active {
            background-color: #5875bb;
        }

        /* =========================
           시작하기 버튼
        ========================= */

        .start-button {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 34px;
            height: 49px;
            border-radius: 11px;
            background-color: #5875b8;
            color: #ffffff;
            font-size: 15px;
            line-height: 49px;
            font-weight: 700;
            text-align: center;
        }

        /* =========================
           하단 홈 인디케이터
        ========================= */

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            width: 134px;
            height: 5px;
            border-radius: 5px;
            background-color: #000000;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <main class="onboarding">

        <!-- 제목 및 설명 -->
        <section class="content">

            <h1>
                <span class="small-title">
                    일상이 바쁠땐 실시간
                </span>

                라이브로 대리만족

                <span class="light-text">
                    하세요
                </span>
            </h1>

            <p>
                라이브로 나를 뽐내고 시청자들과 소통하는 즐거움!
            </p>

        </section>

        <!-- 중앙 캐릭터 이미지 -->
        <section class="visual-area">

            <span class="background-shape"></span>

            <img
                src="./images/work3.ill.png"
                alt="캠프파이어 앞에서 라이브 방송을 하는 곰 캐릭터"
            >

        </section>

        <!-- 세 번째 페이지 표시 -->
        <div class="pagination" aria-label="온보딩 세 번째 화면">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot active"></span>

        </div>

        <!-- 로그인 화면 이동 -->
        <a href="./onboding3.html" class="start-button">
            시작하기
        </a>

        <!-- 하단 홈 인디케이터 -->
        <div class="home-indicator"></div>

    </main>
<script>
     setTimeout(function () {
            window.location.href = "./login.html";
        }, 3000);
</script>
</body>
</html>
