<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA 온보딩 첫 번째 화면</title>

    <style>
        /* =========================
           전체 기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        /* 모바일 앱 전체 화면 */
        .onboarding {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 667px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           상단 상태바
        ========================= */

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            z-index: 10;
        }

        .time {
            position: absolute;
            top: 14px;
            left: 32px;
            color: #111111;
            font-size: 15px;
            line-height: 18px;
            font-weight: 700;
        }

        .status-icons {
            position: absolute;
            top: 17px;
            right: 17px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 통신 신호 아이콘 */
        .signal {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            width: 17px;
            height: 12px;
        }

        .signal i {
            display: block;
            width: 3px;
            border-radius: 1px;
            background-color: #111111;
        }

        .signal i:nth-child(1) {
            height: 4px;
        }

        .signal i:nth-child(2) {
            height: 6px;
        }

        .signal i:nth-child(3) {
            height: 9px;
        }

        .signal i:nth-child(4) {
            height: 12px;
        }

        /* 와이파이 아이콘 */
        .wifi {
            position: relative;
            width: 15px;
            height: 11px;
            overflow: hidden;
        }

        .wifi::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 1px;
            width: 12px;
            height: 12px;
            border: 2px solid #111111;
            border-right-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            transform: rotate(45deg);
        }

        .wifi::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 6px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #111111;
        }

        /* 배터리 아이콘 */
        .battery {
            position: relative;
            width: 22px;
            height: 11px;
            margin-left: 1px;
            border: 1.5px solid #111111;
            border-radius: 3px;
        }

        .battery::before {
            content: "";
            position: absolute;
            top: 1.5px;
            left: 1.5px;
            width: 16px;
            height: 6px;
            border-radius: 1px;
            background-color: #111111;
        }

        .battery::after {
            content: "";
            position: absolute;
            top: 3px;
            right: -3px;
            width: 2px;
            height: 5px;
            border-radius: 0 2px 2px 0;
            background-color: #111111;
        }

        /* =========================
           제목과 설명 영역
        ========================= */

        .content {
            position: absolute;
            top: 102px;
            left: 24px;
            right: 24px;
            z-index: 3;
        }

        .content h1 {
            color: #344c84;
            font-size: 29px;
            line-height: 1.32;
            font-weight: 800;
            letter-spacing: -1.2px;
        }

        .content h1 strong {
            color: #607abc;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.9px;
        }

        .content p {
            width: 320px;
            margin-top: 24px;
            color: #91a7d8;
            font-size: 17px;
            line-height: 1.45;
            font-weight: 500;
            letter-spacing: -0.6px;
            word-break: keep-all;
        }

        /* =========================
           중앙 이미지 영역
        ========================= */

        .visual-area {
            position: absolute;
            top: 339px;
            left: 0;
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        /* 이미지 뒤의 연한 회색 장식 */
        .background-shape {
            position: absolute;
            top: 27px;
            left: 81px;
            width: 360px;
            height: 250px;
            border-radius: 55% 0 0 55%;
            background-color: #f0f2fa;
            transform: rotate(-15deg);
        }

        .visual-area img {
            position: absolute;
            top: 19px;
            left: 68px;
            width: 260px;
            height: auto;
            object-fit: contain;
            z-index: 2;
        }

        /* =========================
           페이지 표시 점
        ========================= */

        .pagination {
            position: absolute;
            top: 664px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(-50%);
        }

        .dot {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #edf0f8;
        }

        .dot.active {
            background-color: #5875bb;
        }

        /* =========================
           시작하기 버튼
        ========================= */

        .start-button {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 34px;
            height: 49px;
            border-radius: 11px;
            background-color: #5875b8;
            color: #ffffff;
            font-size: 15px;
            line-height: 49px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        /* =========================
           하단 홈 인디케이터
        ========================= */

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            width: 134px;
            height: 5px;
            border-radius: 5px;
            background-color: #000000;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <main class="onboarding">

        <!-- 상단 상태바 -->
        <div class="status-bar">

            <p class="time">9:41</p>

            <div class="status-icons">

                <span class="signal">
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                </span>

                <span class="wifi"></span>

                <span class="battery"></span>

            </div>

        </div>

        <!-- 제목과 설명 -->
        <section class="content">

            <h1>
                차박<br>
                어디로
                <strong>떠나야 할지 모르겠나요</strong>
            </h1>

            <p>
                지도기반 위치 앱 및 키워드 검색으로 내가 원하는 장소를 한번에
            </p>

        </section>

        <!-- 중앙 캐릭터 이미지 -->
        <section class="visual-area">

            <span class="background-shape"></span>

            <img
                src="./images/work1.png"
                alt="휴대전화로 차박 장소를 검색하는 곰 캐릭터"
            >

        </section>

        <!-- 현재 페이지 표시 -->
        <div class="pagination" aria-label="온보딩 첫 번째 화면">

            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

        <!-- 다음 화면 이동 버튼 -->
        <a href="./onvoding1.html" class="start-button">
            시작하기
        </a>

        <!-- 하단 홈 인디케이터 -->
        <div class="home-indicator"></div>

    </main>
<script>
    setTimeout(() => {
        window.location.href = "./onboding2.html";
    }, 3000);
</script>
</body>
</html>
