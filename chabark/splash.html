<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA 스플래시</title>

    <style>
        /* 전체 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        /* 모바일 앱 화면 */
        .splash {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 667px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           상단 상태바
        ========================= */

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            z-index: 10;
        }

        .time {
            position: absolute;
            top: 14px;
            left: 32px;
            color: #000000;
            font-size: 15px;
            line-height: 18px;
            font-weight: 700;
        }

        .status-icons {
            position: absolute;
            top: 17px;
            right: 17px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 통신 신호 아이콘 */
        .signal {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            width: 17px;
            height: 12px;
        }

        .signal i {
            display: block;
            width: 3px;
            border-radius: 1px;
            background-color: #000000;
        }

        .signal i:nth-child(1) {
            height: 4px;
        }

        .signal i:nth-child(2) {
            height: 6px;
        }

        .signal i:nth-child(3) {
            height: 9px;
        }

        .signal i:nth-child(4) {
            height: 12px;
        }

        /* 와이파이 아이콘 */
        .wifi {
            position: relative;
            width: 15px;
            height: 11px;
            overflow: hidden;
        }

        .wifi::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 1px;
            width: 12px;
            height: 12px;
            border: 2px solid #000000;
            border-right-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            transform: rotate(45deg);
        }

        .wifi::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 6px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #000000;
        }

        /* 배터리 아이콘 */
        .battery {
            position: relative;
            width: 22px;
            height: 11px;
            margin-left: 1px;
            border: 1.5px solid #000000;
            border-radius: 3px;
        }

        .battery::before {
            content: "";
            position: absolute;
            top: 1.5px;
            left: 1.5px;
            width: 16px;
            height: 6px;
            border-radius: 1px;
            background-color: #000000;
        }

        .battery::after {
            content: "";
            position: absolute;
            top: 3px;
            right: -3px;
            width: 2px;
            height: 5px;
            border-radius: 0 2px 2px 0;
            background-color: #000000;
        }

        /* =========================
           중앙 CAMBA 로고
        ========================= */

        .logo-area {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .logo-area img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* =========================
           하단 홈 인디케이터
        ========================= */

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            width: 134px;
            height: 5px;
            border-radius: 5px;
            background-color: #000000;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <main class="splash">

        <!-- 상단 상태바 -->
        <div class="status-bar">

            <p class="time">9:41</p>

            <div class="status-icons">

                <span class="signal">
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                </span>

                <span class="wifi"></span>

                <span class="battery"></span>

            </div>

        </div>

        <!-- 중앙 로고 -->
        <div class="logo-area">

            <img
                src="./images/logo.svg"
                alt="CAMBA 캠핑카 로고"
            >

        </div>

        <!-- 하단 홈 인디케이터 -->
        <div class="home-indicator"></div>

    </main>
<script>
    setTimeout(() => {
        window.location.href = "./onvoding1.html";
    }, 3000);
</script>
</body>
</html>
