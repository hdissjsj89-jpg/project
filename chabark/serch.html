<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>검색 결과</title>

    <style>
        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #111111;
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            cursor: pointer;
        }

        img {
            display: block;
        }

        /* =========================
           모바일 앱 전체 영역
        ========================= */

        .app {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           상단 내비게이션
        ========================= */

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            width: 100%;
            height: 81px;
            border-bottom: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .back-button {
            position: absolute;
            top: 42px;
            left: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .back-button img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .page-title {
            position: absolute;
            top: 46px;
            left: 50%;
            color: #111111;
            font-size: 18px;
            line-height: 24px;
            font-weight: 800;
            letter-spacing: -0.6px;
            transform: translateX(-50%);
        }

        /* =========================
           검색 결과 스크롤 영역
        ========================= */

        .result-scroll {
            position: absolute;
            top: 81px;
            right: 0;
            bottom: 73px;
            left: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #ffffff;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .result-scroll::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           장소 목록
        ========================= */

        .place-list {
            width: 100%;
        }

        .place-item {
            position: relative;
            display: block;
            min-height: 148px;
            padding: 24px 24px 22px 138px;
            border-bottom: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .place-item.has-image {
            min-height: 148px;
        }

        .place-thumbnail {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 100px;
            height: 101px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #eeeeee;
        }

        .place-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-name {
            padding-right: 34px;
            color: #111111;
            font-size: 18px;
            line-height: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .place-address {
            margin-top: 4px;
            padding-right: 30px;
            color: #333333;
            font-size: 13px;
            line-height: 19px;
            font-weight: 500;
            letter-spacing: -0.2px;
            word-break: keep-all;
        }

        .bookmark-link {
            position: absolute;
            top: 26px;
            right: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 28px;
        }

        .bookmark-link img {
            width: 20px;
            height: 23px;
            object-fit: contain;
        }

        .place-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 31px;
        }

        .tag-list {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            height: 25px;
            padding: 0 10px;
            border-radius: 10px;
            background-color: #5875ba;
            color: #ffffff;
            font-size: 12px;
            line-height: 25px;
            font-weight: 500;
            white-space: nowrap;
        }

        .distance {
            color: #4f70bf;
            font-size: 16px;
            line-height: 22px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* 이미지가 없는 장소 */
        .place-item.no-image {
            min-height: 148px;
            padding-left: 138px;
        }

        .place-item.no-image::before {
            content: "";
            position: absolute;
            top: 24px;
            left: 24px;
            width: 100px;
            height: 101px;
        }

        /* =========================
           하단 내비게이션
        ========================= */

        .bottom-navigation {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 30;
            width: 100%;
            height: 73px;
            border-top: 1px solid #e9e9e9;
            background-color: #ffffff;
        }

        .bottom-menu {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            height: 100%;
        }

        .bottom-menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #111111;
        }

        .bottom-menu a.active {
            color: #4e70bd;
        }

        .bottom-menu img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .nav-name {
            margin-top: 3px;
            font-size: 14px;
            line-height: 18px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- 상단 내비게이션 -->
        <header class="top-bar">

            <button
                type="button"
                class="back-button"
                onclick="./chabark/home.html()"
                aria-label="이전 화면으로 이동"
            >
                <img
                    src="./icons/icons/arrow.svg"
                    alt=""
                >
            </button>

            <h1 class="page-title">검색결과</h1>

        </header>

        <!-- 검색 결과 스크롤 영역 -->
        <section class="result-scroll">

            <div class="place-list">

                <!-- 장소 1 -->
                <a
                    href="./place-detail-mangwon.html"
                    class="place-item has-image"
                >

                    <div class="place-thumbnail">
                        <img
                            src="./images/main.png"
                            alt="망원한강공원"
                        >
                    </div>

                    <h2 class="place-name">망원한강공원</h2>

                    <p class="place-address">
                        서울 마포구 망원동 205-4
                    </p>

                    <span
                        class="bookmark-link"
                        aria-label="망원한강공원 북마크"
                    >
                        <img
                            src="./icons/icons.svg"
                            alt=""
                        >
                    </span>

                    <div class="place-bottom">

                        <div class="tag-list">
                            <span class="tag">차크닉</span>
                            <span class="tag">주차장</span>
                        </div>

                        <span class="distance">11.1km</span>

                    </div>

                </a>

                <!-- 장소 2 -->
                <a
                    href="./place-detail-gwanggyo.html"
                    class="place-item no-image"
                >

                    <h2 class="place-name">광교호수공원</h2>

                    <p class="place-address">
                        서울 마포구 망원동 205-4
                    </p>

                    <span
                        class="bookmark-link"
                        aria-label="광교호수공원 북마크"
                    >
                        <img
                            src="./icons/icons.svg"
                            alt=""
                        >
                    </span>

                    <div class="place-bottom">

                        <div class="tag-list">
                            <span class="tag">도심</span>
                            <span class="tag">주차장</span>
                        </div>

                        <span class="distance">26km</span>

                    </div>

                </a>

                <!-- 장소 3 -->
                <a
                    href="./place-detail-gareu.html"
                    class="place-item has-image"
                >

                    <div class="place-thumbnail">
                        <img
                            src="./images/main-2.png"
                            alt="가르 알바데기"
                        >
                    </div>

                    <h2 class="place-name">가르 알바데기</h2>

                    <p class="place-address">
                        대거리 2214-207
                    </p>

                    <span
                        class="bookmark-link"
                        aria-label="가르 알바데기 북마크"
                    >
                        <img
                            src="./icons/icons.svg"
                            alt=""
                        >
                    </span>

                    <div class="place-bottom">

                        <div class="tag-list">
                            <span class="tag">오션뷰</span>
                            <span class="tag">주차장</span>
                        </div>

                        <span class="distance">108km</span>

                    </div>

                </a>

                <!-- 장소 4 -->
                <a
                    href="./place-detail-gungpyeong.html"
                    class="place-item no-image"
                >

                    <h2 class="place-name">화성 궁평항</h2>

                    <p class="place-address">
                        경기도 화성시 서신면<br>
                        궁평항로 1049-24
                    </p>

                    <span
                        class="bookmark-link"
                        aria-label="화성 궁평항 북마크"
                    >
                        <img
                            src="./icons/icons.svg"
                            alt=""
                        >
                    </span>

                    <div class="place-bottom">

                        <div class="tag-list">
                            <span class="tag">차크닉</span>
                            <span class="tag">주차장</span>
                        </div>

                        <span class="distance">58km</span>

                    </div>

                </a>

                <!-- 장소 5 -->
                <a
                    href="./place-detail-donnaeko.html"
                    class="place-item has-image"
                >

                    <div class="place-thumbnail">
                        <img
                            src="./images/main-4.png"
                            alt="서귀포 돈내코"
                        >
                    </div>

                    <h2 class="place-name">서귀포 돈내코</h2>

                    <p class="place-address">
                        제주특별자치도<br>
                        서귀포시 돈내코로 114
                    </p>

                    <span
                        class="bookmark-link"
                        aria-label="서귀포 돈내코 북마크"
                    >
                        <img
                            src="./icons/icons.svg"
                            alt=""
                        >
                    </span>

                    <div class="place-bottom">

                        <div class="tag-list">
                            <span class="tag">이색</span>
                            <span class="tag">주차장</span>
                        </div>

                        <span class="distance">483km</span>

                    </div>

                </a>

                <!-- 장소 6 -->
                <a
                    href="./place-detail-masin.html"
                    class="place-item no-image"
                >

                    <h2 class="place-name">영종도 마시안해변</h2>

                    <p class="place-address">
                        덕교동 662-9
                    </p>

                    <span
                        class="bookmark-link"
                        aria-label="영종도 마시안해변 북마크"
                    >
                        <img
                            src="./icons/icons.svg"
                            alt=""
                        >
                    </span>

                    <div class="place-bottom">

                        <div class="tag-list">
                            <span class="tag">수도권</span>
                            <span class="tag">주차장</span>
                        </div>

                        <span class="distance">32km</span>

                    </div>

                </a>

            </div>

        </section>

        <!-- 하단 고정 내비게이션 -->
        <nav class="bottom-navigation" aria-label="하단 메뉴">

            <div class="bottom-menu">

                <a href="./home.html">
                    <img
                        src="./icons/icons/home.svg"
                        alt=""
                    >
                    <span class="nav-name">홈</span>
                </a>

                <a href="./search.html" class="active">
                    <img
                        src="./icons/icons/search.svg"
                        alt=""
                    >
                    <span class="nav-name">검색</span>
                </a>

                <a href="./community.html">
                    <img
                        src="./icons/icons/community.svg"
                        alt=""
                    >
                    <span class="nav-name">모임</span>
                </a>

                <a href="./live.html">
                    <img
                        src="./icons/icons/live.svg"
                        alt=""
                    >
                    <span class="nav-name">LIVE</span>
                </a>

                <a href="./mypage.html">
                    <img
                        src="./icons/icons/user.svg"
                        alt=""
                    >
                    <span class="nav-name">MY</span>
                </a>

            </div>

        </nav>

    </main>

</body>
</html>
