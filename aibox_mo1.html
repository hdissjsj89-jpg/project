<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Box Model</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    font-family:"맑은 고딕", sans-serif;
}

.parent{
    width:1000px;
    height:500px;
    border:5px solid blue;
    margin:10px auto;
}

.child{
    width:300px;
    height:200px;
    border:4px solid #000;
    float:left;
    margin-right:25px;
}

.child:last-child{
    margin-right:0;
}
</style>

</head>
<body>

<div class="parent">

    <div class="child">
        배너1
    </div>

    <div class="child">
        배너2
    </div>

    <div class="child">
        배너3
    </div>

</div>

</body>
</html>
