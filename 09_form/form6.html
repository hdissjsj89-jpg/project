<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>자동차 브랜드 선택</title>

  <link rel="stylesheet" href="./css/main6.css">
</head>

<body>

  <div class="form-wrap">

    <div class="select-row">
      <label for="carBrand">자동차 브랜드 선택:</label>

      <select id="carBrand" name="carBrand" multiple size="4">
        <option value="volvo">볼보</option>
        <option value="saab">싸브</option>
        <option value="fiat">피아트</option>
        <option value="audi">아우디</option>
      </select>
    </div>

    <button type="submit">제출</button>

  </div>

</body>
</html>
