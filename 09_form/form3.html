<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원 가입</title>

  <link rel="stylesheet" href="./css/main3.css">
</head>

<body>

  <div class="signup-wrap">

    <h1>회원 가입</h1>

    <!-- 필수정보 -->
    <fieldset>
      <legend>필수정보</legend>

      <div class="form-row">
        <label for="name">이름 :</label>
        <input type="text" id="name">
      </div>
    </fieldset>

    <!-- 선택 정보 -->
    <fieldset>
      <legend>선택 정보</legend>

      <div class="form-row">
        <label for="birth">생일 :</label>
        <input type="date" id="birth">
      </div>
    </fieldset>

  </div>

</body>
</html>
