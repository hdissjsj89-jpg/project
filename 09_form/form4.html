<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>신청과목 및 메일링</title>

  <link rel="stylesheet" href="./css/main4.css">
</head>

<body>

  <div class="form-wrap">

    <!-- 신청과목 -->
    <fieldset>
      <legend>신청과목</legend>

      <p class="description">
        이 달에 신청할 과목을 선택하세요 (1과목만 가능)
      </p>

      <div class="option-group">
        <label>
          <input
            type="radio"
            name="subject"
            value="회화"
            checked
          >
          회화
        </label>

        <label>
          <input
            type="radio"
            name="subject"
            value="문법"
          >
          문법
        </label>

        <label>
          <input
            type="radio"
            name="subject"
            value="작문"
          >
          작문
        </label>
      </div>
    </fieldset>


    <!-- 메일링 -->
    <fieldset>
      <legend>메일링</legend>

      <p class="description">
        메일로 받고 싶은 뉴스 주제를 선택해 주세요(복수선택가능)
      </p>

      <div class="option-group">
        <label>
          <input
            type="checkbox"
            name="news"
            value="해외단신"
            checked
          >
          해외단신
        </label>

        <label>
          <input
            type="checkbox"
            name="news"
            value="5분 회화"
            checked
          >
          5분 회화
        </label>

        <label>
          <input
            type="checkbox"
            name="news"
            value="모닝팝스"
            checked
          >
          모닝팝스
        </label>
      </div>
    </fieldset>

  </div>

</body>
</html>
