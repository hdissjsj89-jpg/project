<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>폼 구성 요소 알아보기</title>

  <link rel="stylesheet" href="./css/main.css">
</head>

<body>

  <div class="form-wrap">

    <h1>[폼 구성 요소 알아보기]</h1>

    <form>

      <fieldset>
        <legend>기본 폼 구성 요소</legend>

        <div class="form-row">
          <span class="number">1.</span>

          <label for="userId">ID</label>

          <input
            type="text"
            id="userId"
            class="text-input"
          >
        </div>


        <div class="form-row">
          <span class="number">2.</span>

          <label for="password">PASSWORD</label>

          <input
            type="password"
            id="password"
            class="text-input"
          >
        </div>


        <div class="form-row">
          <span class="number">3.</span>

          <label>
            <input
              type="radio"
              name="gender"
              value="남"
              checked
            >
            남
          </label>

          <label>
            <input
              type="radio"
              name="gender"
              value="여"
            >
            여
          </label>
        </div>


        <div class="form-row">
          <span class="number">4.</span>

          <label>
            여행
            <input
              type="checkbox"
              name="hobby"
              value="여행"
            >
          </label>

          <label>
            영화
            <input
              type="checkbox"
              name="hobby"
              value="영화"
              checked
            >
          </label>

          <label>
            독서
            <input
              type="checkbox"
              name="hobby"
              value="독서"
            >
          </label>
        </div>


        <div class="form-row select-row">
          <span class="number">5.</span>

          <label for="colorSelect">칼라선택 :</label>

          <select id="colorSelect">
            <option selected>:::::: Color Select::::::</option>
            <option>빨간색</option>
            <option>녹색</option>
            <option>파란색</option>
          </select>
        </div>


        <div class="form-row textarea-row">
          <span class="number">6.</span>

          <label for="message">MESSAGE</label>

          <textarea
            id="message"
            rows="4"
            cols="30"
          ></textarea>
        </div>


        <div class="form-row file-row">
          <span class="number">7.</span>

          <label for="file">파일 첨부 :</label>

          <input
            type="file"
            id="file"
          >
        </div>

      </fieldset>


      <div class="button-area">
        <button type="submit">전송하기</button>
        <button type="reset">다시작성</button>
        <button type="button">검색</button>
      </div>

    </form>

  </div>

</body>
</html>
