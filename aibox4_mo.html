<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>박스 배치 실습</title>

<style>
*{
    margin:0;
    padding:0;
}

body{
    background-color:#ffffff;
    font-family:"맑은 고딕", sans-serif;
}

/* 부모 박스 */
.parent{
    width:1000px;
    height:300px;
    margin:4px auto 0;
    border:5px solid red;
}

/* 자식 박스 공통 */
.child{
    width:480px;
    height:300px;
    background-color:#e665e5;
    float:left;
}

/* 첫 번째 박스 오른쪽 여백 */
.box1{
    margin-right:40px;
}
</style>
</head>

<body>

<div class="parent">
    <div class="child box1">박스1</div>
    <div class="child">박스2</div>
</div>

</body>
</html>
