<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>박스 모델</title>

<style>
*{
    margin:0;
    padding:0;
}

body{
    background:#ffffff;
    font-family:"맑은 고딕", sans-serif;
}

/* 부모 */
ul{
    width:1000px;
    height:300px;
    margin:0 auto;
    border:5px solid #000;
    list-style:none;
}

/* 자식 */
li{
    width:320px;
    height:300px;
    float:left;
    background:#ffff00;
}

/* 첫 번째, 두 번째만 오른쪽 여백 */
li:nth-child(1),
li:nth-child(2){
    margin-right:20px;
}
</style>

</head>
<body>

<ul>
    <li>박스1</li>
    <li>박스2</li>
    <li>박스3</li>
</ul>

</body>
</html>
