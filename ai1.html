<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>표준 웹 기술</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"맑은 고딕", Arial, sans-serif;
    background:#fff;
    padding:8px;
}

.container{
    width:320px;
    padding:38px 12px;
    border:1px solid #333;
}

h1{
    font-size:30px;
    font-weight:bold;
    color:#000;
    margin-bottom:42px;
}

p{
    margin-bottom:48px;
    color:#0000ff;
    font-size:18px;
    line-height:1;
}

p:last-child{
    margin-bottom:0;
}

.initial{
    display:inline-block;
    font-size:50px;
    font-weight:bold;
    color:#ff0000;
    line-height:0.8;
    vertical-align:middle;
    margin-right:2px;
}

.word{
    vertical-align:middle;
}
</style>

</head>
<body>

<div class="container">

    <h1>표준 웹 기술</h1>

    <p>
        <span class="initial">H</span><span class="word">TML</span>
    </p>

    <p>
        <span class="initial">C</span><span class="word">SS</span>
    </p>

    <p>
        <span class="initial">J</span><span class="word">avascript</span>
    </p>

</div>

</body>
</html>
