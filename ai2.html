<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>진달래 꽃</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    position:relative;
    width:100%;
    height:100vh;
    font-family:"맑은 고딕", sans-serif;
}

/* 제목 */
h1{
    text-align:center;
    font-size:52px;
    margin-top:30px;
    font-weight:bold;
}

/* 이름 */
p:first-of-type{
    position:absolute;
    top:90px;
    right:40px;
    font-size:24px;
    font-weight:bold;
}

/* 시 */
p:last-of-type{
    text-align:center;
    font-size:24px;
    line-height:1.7;
    margin-top:60px;
}

</style>

</head>

<body>

<h1>진달래 꽃</h1>

<p>지은이 : 김소월</p>

<p>
나 보기가<br>
역겨워<br>
가실 때에는<br><br>

말 없이<br>
고이<br>
보내 드리오리다<br><br>

영변에<br>
약산<br>
진달래 꽃<br><br>

진달래<br>
진달래 꽃<br>
피웠네
</p>

</body>
</html>
