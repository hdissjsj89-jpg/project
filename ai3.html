<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>표준 웹 기술</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    padding:8px;
    background:#fff;
    font-family:"맑은 고딕", sans-serif;
}

.box{
    width:320px;
    padding:38px 12px;
    border:1px solid #333;
}

h1{
    font-size:30px;
    font-weight:bold;
    color:#000;
    margin-bottom:42px;
}

.item{
    margin-bottom:46px;
    color:#0000ff;
    font-size:20px;
    line-height:1;
}

.item:last-child{
    margin-bottom:0;
}

.first{
    display:inline-block;
    color:#ff0000;
    font-size:50px;
    font-weight:bold;
    line-height:1;
    vertical-align:middle;
}

.text{
    display:inline-block;
    margin-left:2px;
    vertical-align:middle;
}
</style>

</head>
<body>

<div class="box">

    <h1>표준 웹 기술</h1>

    <p class="item">
        <span class="first">H</span>
        <span class="text">TML</span>
    </p>

    <p class="item">
        <span class="first">C</span>
        <span class="text">SS</span>
    </p>

    <p class="item">
        <span class="first">J</span>
        <span class="text">avascript</span>
    </p>

</div>

</body>
</html>
